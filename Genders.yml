section_name: Genders
terms:
  - agender:
      name: Agender
      definition: A person who does not identify as having a gender.
  - androgynous:
      name: Androgynous
      definition: A person who identifies with fluid physical characteristics of all genders.
  - bi_gender:
      name: Bi-gender
      definition: A person who identifies with two or more genders, either at the same or different times.
  - butch:
      name: Butch
      definition: A person who is typically female-identified whose social and relationship roles are perceived by many as being masculine, often having a lesbian, gay, or queer orientation.
  - crossdresser:
      name: Crossdresser/Drag
      definition: A person who likes to dress and act in a style or manner traditionally associated with the opposite gender on a frequent basis.
  - drag:
      name: Drag King/Queen
      definition: A person who likes to dress and act in a style or manner traditionally associated with the opposite gender on a perfomance basis.
  - female:
      name: Female
      definition: A person who was born with XX chromosomes.
  - woman:
      name: Women
      definition: A person who identifies with more feminine traits and characteristics.
  - femme:
      name: Femme
      definition: A person who has an appearance or other characteristics traditionally seen as feminine, often having a lesbian, gay, or queer orientation.
  - gender_fluid:
      name: Gender Fluid
      definition: A person who fluctuates between more than one gender, or between having a gender and not having one.
  - genderqueer:
      name: Genderqueer
      definition: A person whose gender identity falls outside the male-female binary.
  - intersex:
      name: Intersex
      definition: A person who is born with a reproductive or sexual anatomy that doesn't seem to fit the typical definitions of female or male.
  - male:
      name: Male
      definition: A person who hwas born with XY chromosomes.
  - man:
      name: Man
      definition: A person who identifies with more masculine traits and characteristics.
  - non_binary:
      name: Non-Binary
      definition: A person whose gender identity falls outside the man-women binary.
  - trans_man:
      name: Trans Man
      definition: A person who is transgender and identifies as a man.
  - trans_woman:
      name: Trans Woman
      definition: A person who is transgender and identifies as a woman.
  - transgender:
      name: Transgender
      definition: A person whose sense of personal identity and gender does not correspond with their biological sex assigned at birth.
  - two_spirit:
      name: Two-Spirit
      definition: A person who has both a masculine and a feminine spirit. Used by Indigenous First Nations and Native American peoples to describe their sexual, gender and/or spiritual identity.