section_name: Orientations
terms:
  - asexual:
      name: Asexual
      definition: A person who has low or absent sexual interest or desire for people of any gender.
  - bicurious:
      name: Bi-curious
      definition: A person who is curious about being sexual with someone of the same sex, but does not consider themselves to be bisexual.
  - bisexual:
      name: Bisexual
      definition: A person who is attracted romantically and/or sexually to two or more genders.
  - demisexual:
      name: Demisexual
      description: A person who does not experience sexual attraction unless they form a strong emotional connection with someone.
  - fluctuating:
      name: Fluctuating
      definition: A person whose sexual responsiveness is opened to continued changing.
  - gay:
      name: Gay
      definition: A man who is primarily attracted to other men in a sexual and/or romantic way. Also used as a umbrella term for non-straight sexual and romantic attraction.
  - greysexual:
      name: Greysexual
      description: A person who experiences sexual attraction under very limited and specific circumstances. Greysexual is sometimes referred to as grey-asexual and falls under the asexual umbrella.
  - heteroflexible:
      name: Heteroflexible
      definition: A person who identifies as primarily straight but can occasionally find the same gender appealing in a sexual and/or romantic way.
  - homoflexible:
      name: Homoflexible
      definition: A person who identifies as primarily homosexual but can occasionally find the opposite gender appealing in a sexual and/or romantic way.
  - lesbian:
      name: Lesbian
      definition: A women who is primarily attracted to other women in a sexual and/or romantic way.
  - pansexual:
      name: Pansexual
      definition: A person who is attracted to and may form sexual and romantic relationships with anyone of any identity.
  - queer:
      name: Queer
      definition: A person who doesn't identify with traditional categories around gender identity and sexual orientation.
  - sapiosexual:
      name: Sapiosexual
      description: A person who is sexually attracted to someone’s form of intelligence.
  - straight:
      name: Straight
      definition: A person who is attracted to the opposite gender in a sexual and/or romantic way.