section_name: Orientations
terms:
  - asexual:
      name: Asexual
      definition: Someone who feels little or no sexual attraction.
  - bicurious:
      name: Bi-curious
      definition: Curious about sex with the same gender, without calling yourself bisexual.
  - bisexual:
      name: Bisexual
      definition: Attracted to more than one gender.
  - demisexual:
      name: Demisexual
      definition: Attraction only appears after a strong emotional bond.
  - fluctuating:
      name: Fluctuating
      definition: Attraction that changes over time.
  - gay:
      name: Gay
      definition: A man attracted to men, or an umbrella word for same-gender attraction.
  - greysexual:
      name: Greysexual
      definition: Attraction that is rare or only happens in specific situations.
  - heteroflexible:
      name: Heteroflexible
      definition: Mostly straight, with occasional same-gender attraction.
  - homoflexible:
      name: Homoflexible
      definition: Mostly gay or lesbian, with occasional other-gender attraction.
  - lesbian:
      name: Lesbian
      definition: A woman attracted to women.
  - pansexual:
      name: Pansexual
      definition: Attracted to people of any gender.
  - queer:
      name: Queer
      definition: An umbrella word for people who are not straight or cisgender.
  - sapiosexual:
      name: Sapiosexual
      definition: Attraction that centres on intelligence.
  - straight:
      name: Straight
      definition: Attracted to the opposite gender.
